spring:
  application:
    name: domradar
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:domradar}
    username: ${POSTGRES_USER:domradar}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_INTERNAL_PORT:6379}
  cache:
    type: redis
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true
  web:
    # Komunikaty walidacji (Hibernate Validator) po polsku niezależnie od Accept-Language
    locale: pl_PL
    locale-resolver: fixed
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
    scheduling:
      pool:
        size: 4

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3080}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3080}
  jwt:
    secret: ${JWT_SECRET}
    issuer: domradar
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    refresh-cookie-name: domradar_refresh
    cookie-secure: ${APP_COOKIE_SECURE:false}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  demo-user:
    email: ${DEMO_USER_EMAIL:}
    password: ${DEMO_USER_PASSWORD:}
  mail:
    from: ${MAIL_FROM:alerty@domradar.local}
  ingestion:
    bootstrap-import: ${APP_BOOTSTRAP_IMPORT:true}
    # Dane syntetyczne (DemoAdapter) i snapshoty; wyłącz, gdy korzystasz tylko z prawdziwych ogłoszeń
    demo-data-enabled: ${DEMO_DATA_ENABLED:true}
    batch-size: 50
    missed-imports-to-deactivate: 3
    scheduler-enabled: true
    snapshots-dir: ${SNAPSHOTS_DIR:../data/snapshots}
    eur-rate: 4.30
    demo:
      seed: 20261119
      universe-size: 1600
  dedup:
    threshold: 70
    candidate-radius-meters: 600
  limits:
    max-saved-searches: 10
    max-instant-alerts: 3
  # Prawdziwe ogłoszenia z portali (patrz README, "Aspekt prawny"). Wyłączone, dopóki LIVE_SOURCES_ENABLED != true.
  sources:
    otodom-live:
      live-enabled: ${LIVE_SOURCES_ENABLED:false}
      user-agent: ${LIVE_USER_AGENT:DomRadarBot/1.0 (projekt studencki; agregator ogloszen)}
      min-delay-ms: ${LIVE_MIN_DELAY_MS:3000}
      max-pages: ${LIVE_MAX_PAGES:2}
      cities: ${LIVE_CITIES:}
      stale-days: 14
    olx-live:
      live-enabled: ${LIVE_SOURCES_ENABLED:false}
      user-agent: ${LIVE_USER_AGENT:DomRadarBot/1.0 (projekt studencki; agregator ogloszen)}
