spring:
  application:
    name: domradar
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:domradar}
    username: ${POSTGRES_USER:domradar}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_INTERNAL_PORT:6379}
  cache:
    type: redis
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
    scheduling:
      pool:
        size: 4

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    issuer: domradar
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    refresh-cookie-name: domradar_refresh
    cookie-secure: ${APP_COOKIE_SECURE:false}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  demo-user:
    email: ${DEMO_USER_EMAIL:}
    password: ${DEMO_USER_PASSWORD:}
  mail:
    from: ${MAIL_FROM:alerty@domradar.local}
  ingestion:
    bootstrap-import: ${APP_BOOTSTRAP_IMPORT:true}
    batch-size: 50
    missed-imports-to-deactivate: 3
    scheduler-enabled: true
    snapshots-dir: ${SNAPSHOTS_DIR:../data/snapshots}
    demo:
      seed: 20261119
      universe-size: 1600
  dedup:
    threshold: 70
    candidate-radius-meters: 600
  limits:
    max-saved-searches: 10
    max-instant-alerts: 3
  sources:
    otodom-live:
      live-enabled: false
      user-agent: "DomRadarBot/1.0 (+https://github.com/domradar; kontakt przez stronę projektu)"
      min-delay-ms: 3000
      start-url: https://www.otodom.pl/pl/wyniki/sprzedaz/mieszkanie/cala-polska

logging:
  level:
    root: INFO
    pl.domradar: INFO
    org.hibernate.orm.deprecation: ERROR
